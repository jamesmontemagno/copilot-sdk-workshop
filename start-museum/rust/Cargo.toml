[package]
name = "museum-exhibit-studio"
version = "1.0.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
async-trait = "=0.1.91"
github-copilot-sdk = { version = "=1.0.11", features = ["derive"] }
indexmap = "=2.14.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread"] }
